              expression: '>= 0'
      - name: close
        description: Cryptocurrency value at the end of the month
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: '>= 0'
      - name: volume_from
        description: Amount of coins exchanged during the month in cryptocurrency (e.g BTC, ETH)
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: '>= 0'
      - name: volume_to
        description: Corresponding value of coins exchanged during the month in local currency (e.g EUR, USD)
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: '>= 0'
  - name: fct_crypto_yearly
    tags: ["yearly"]
    tests:
      - dbt_utils.fewer_rows_than:
          compare_model: ref('fct_crypto_hourly')
          compare_model: ref('fct_crypto_daily')
          compare_model: ref('fct_crypto_weekly')
          compare_model: ref('fct_crypto_monthly')
      # - dbt_utils.expression_is_true:
