version: 2
models:
  - name: fct_crypto_daily
    tags: ["daily"]
    # tests:
      # - dbt_utils.fewer_rows_than:
      #     compare_model: ref('fct_crypto_hourly')
      # - dbt_utils.expression_is_true:
      #     expression: 'high >= low'
      # - dbt_utils.expression_is_true:
      #     expression: 'high >= open'
      # - dbt_utils.expression_is_true:
      #     expression: 'high >= close'
      # - dbt_utils.expression_is_true:
      #     expression: 'low <= open'
      # - dbt_utils.expression_is_true:
      #     expression: 'low <= close'
    columns:
      - name: date
        description: Calendar date
        tests:
          - unique
          - not_null
          - dbt_utils.sequential_values:
              interval: 1
              datepart: 'day'
      - name: high
        description: Crypto highest value reached during the day
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: '>= 0'
      - name: low
        description: Crypto lowest value reached during the day
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: '>= 0'
      - name: open
        description: Cryptocurrency value at the beginning of the day
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: '>= 0'
      - name: close
        description: Cryptocurrency value at the end of the day
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: '>= 0'
      - name: volume_from
        description: Amount of coins exchanged during the day in cryptocurrency (e.g BTC, ETH)
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: '>= 0'
      - name: volume_to
        description: Corresponding value of coins exchanged during the day in local currency (e.g EUR, USD)
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: '>= 0'
  - name: fct_crypto_weekly
    tags: ["weekly"]
    tests:
      - dbt_utils.fewer_rows_than:
          compare_model: ref('fct_crypto_hourly')
          compare_model: ref('fct_crypto_daily')
      # - dbt_utils.expression_is_true:
      #     expression: 'high >= low'
      # - dbt_utils.expression_is_true:
      #     expression: 'high >= open'
      # - dbt_utils.expression_is_true:
      #     expression: 'high >= close'
      # - dbt_utils.expression_is_true:
      #     expression: 'low <= open'
      # - dbt_utils.expression_is_true:
      #     expression: 'low <= close'
    columns:
      - name: date
        description: Calendar date corresponding to the first day of the week
        tests:
          - unique
          - not_null
          # - dbt_utils.sequential_values:
          #     interval: 1
          #     datepart: 'week' --> is 'week' not a valid arg?
      - name: calendar_year
        tests:
          - not_null
      - name: calendar_week
        description: Week number in the year
        tests:
          - not_null
      - name: high
        description: Crypto highest value reached during the week
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: '>= 0'
      - name: low
        description: Crypto lowest value reached during the week
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: '>= 0'
      - name: open
        description: Cryptocurrency value at the beginning of the week
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: '>= 0'
      - name: close
        description: Cryptocurrency value at the end of the week
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: '>= 0'
      - name: volume_from
        description: Amount of coins exchanged during the week in cryptocurrency (e.g BTC, ETH)
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: '>= 0'
      - name: volume_to
        description: Corresponding value of coins exchanged during the week in local currency (e.g EUR, USD)
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: '>= 0'
  - name: fct_crypto_monthly
    tags: ["monthly"]
    tests:
      - dbt_utils.fewer_rows_than:
          compare_model: ref('fct_crypto_hourly')
          compare_model: ref('fct_crypto_daily')
          compare_model: ref('fct_crypto_weekly')
      # - dbt_utils.expression_is_true:
      #     expression: 'high >= low'
      # - dbt_utils.expression_is_true:
      #     expression: 'high >= open'
      # - dbt_utils.expression_is_true:
      #     expression: 'high >= close'
      # - dbt_utils.expression_is_true:
      #     expression: 'low <= open'
      # - dbt_utils.expression_is_true:
      #     expression: 'low <= close'
    columns:
      - name: date
        description: Calendar date corresponding to the first day of the month
        tests:
          - unique
          - not_null
          - dbt_utils.sequential_values:
              interval: 1
              datepart: 'month'
      - name: calendar_year
        tests:
