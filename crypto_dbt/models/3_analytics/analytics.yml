version: 2
models:
  - name: daily_kpis
    tags: ["daily", "gold"]
    columns:
      - name: date
        description: Calendar date
        tests:
          - unique
          - not_null
          - dbt_utils.sequential_values:
              interval: 1
              datepart: 'day'
  - name: weekly_kpis
    tags: ["weekly", "gold"]
    columns:
      - name: date
        description: Calendar date corresponding to the first day of the week
        tests:
          - unique
          - not_null
          # - dbt_utils.sequential_values:
          #    interval: 1
          #    datepart: 'week' --> is 'week' not a valid arg?
      - name: calendar_year
        tests:
          - not_null
      - name: calendar_week
        description: Week number in the year
        tests:
          - not_null
  - name: monthly_kpis
    tags: ["monthly", "gold"]
    columns:
      - name: date
        description: Calendar date corresponding to the first day of the month
        tests:
          - unique
          - not_null
          - dbt_utils.sequential_values:
              interval: 1
              datepart: 'month'
      - name: calendar_year
        tests:
          - not_null
      - name: calendar_month
        tests:
          - not_null
  - name: yearly_kpis
    tags: ["yearly", "gold"]
    columns:
      - name: date
        description: Calendar date corresponding to the first day of the year
        tests:
          - unique
          - not_null
          - dbt_utils.sequential_values:
              interval: 1
              datepart: 'year'
      - name: calendar_year
        tests:
          - not_null